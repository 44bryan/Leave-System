{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AEF HRM</title>
    <link rel="icon" type="image/png" href="{% static 'logo.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #e8f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 40px rgba(13,168,192,.15); }
    </style>
</head>
<body>
<div class="container" style="max-width:440px;">
    <div class="text-center mb-4">
        <img src="{% static 'logo.jpg' %}" alt="Logo" style="height:56px;border-radius:10px;">
        <div style="font-size:1.1rem;font-weight:700;color:#0A4D68;margin-top:12px;">AEF HRM</div>
    </div>
    <div class="card p-4">
        <h5 class="mb-1" style="color:#0A4D68;font-weight:700;">Reset your password</h5>
        <p class="text-muted mb-4" style="font-size:.85rem;">Enter your email address and we'll send you a link to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-600" style="font-size:.85rem;">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100" style="background:#0A4D68;border:none;">
                <i class="bi bi-envelope me-1"></i> Send Reset Link
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'accounts:login' %}" style="font-size:.85rem;color:#2db4c3;text-decoration:none;">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>
</div>
</body>
</html>
