{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Email Sent" %} — AEF HRM</title>
    <link rel="icon" type="image/png" href="{% static 'logo.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background:#e8f6f9;min-height:100vh;display:flex;align-items:center;justify-content:center;}.card{border:none;border-radius:16px;box-shadow:0 8px 40px rgba(13,168,192,.15);}</style>
</head>
<body>
<div class="container" style="max-width:440px;">
    <div class="text-center mb-4">
        <img src="{% static 'logo.jpg' %}" alt="Logo" style="height:56px;border-radius:10px;">
    </div>
    <div class="card p-4 text-center">
        <div class="mb-3" style="font-size:3rem;color:#059669;"><i class="bi bi-envelope-check"></i></div>
        <h5 style="color:#0A4D68;font-weight:700;">{% trans "Check your email" %}</h5>
        <p class="text-muted" style="font-size:.88rem;">
            {% trans "If an account exists for that email, we've sent a password reset link. Check your inbox and spam folder." %}
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-2" style="font-size:.88rem;">
            <i class="bi bi-arrow-left me-1"></i> {% trans "Back to Login" %}
        </a>
    </div>
</div>
</body>
</html>
